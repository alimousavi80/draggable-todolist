<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>draggale todolist</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="modal-box hide-modal">
        <div class="modal">
            <label for="input"> write your todo</label>
            <input type="text" autofocus name="" id="input">
            <button class="addtodo2">add</button>
            <p id="close">*</p>
        </div>
    </section>
    <main class="container">
        <section class="column1 column">
            <h2>no status</h2>
            <button class="addtodo1">+ add todo</button>
            <div class="gg">
            <div class="todos">
                <p class="todo-text">ali is the luckiest</p>
                <span class="closing"></span>
            </div>
            </div>
        </section>
        </section>
        <section class="column2 column">
            <h2>not started</h2>
        </section>
        <section class="column3 column">
            <h2>in progress</h2>
        </section>
        <section class="column4 column">
            <h2>completed</h2>
        </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
