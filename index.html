<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>draggale todolist</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- start svg sprite part -->

    <svg class="svg-sprite">
        <symbol id="bin-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
      <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
        </symbol>
        <symbol
            id="xmark-icon"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
        </symbol>
    </svg>


    <!-- finish svg sprite part -->

    <!-- start modal part -->

        <section class="modal-box">
                <input type="text" placeholder="write your todo" autofocus name="" id="input">
                <button class="modal__addtodo-btn">add</button>
                <svg id="close"><use href="#xmark-icon"></use>></svg>     
        </section>

    <!-- finish modal part -->

    <!-- start box parts -->

    <main class="container">
        <div class="box-container">
        <section class="column1 column">
            <h2>no status</h2>
            <button class="box-container__addtodo-btn">+ add todo</button>
                <div class="todo-container">

                    <!-- loaded from js -->

                </div>
        </section>
        </section>
        <section class="column2 column">
            <h2>not started</h2>
        </section>
        <section class="column3 column">
            <h2>in progress</h2>
        </section>
        <section class="column4 column">
            <h2>completed</h2>
        </section>
        </div>
    </main>

    <!-- finish box parts -->

    <script src="./main.js"></script>
  </body>
</html>
